  if(tab==="days") renderDays();
  if(tab==="verbs") renderVerbs(false);
  if(tab==="vocab") renderVocab();
  window.scrollTo({top:0});
}
document.querySelectorAll(".tab").forEach(t=> t.onclick=()=>switchTab(t.dataset.tab));

function chev(dir){
  return dir==="left"
   ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`
   : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>`;
}
function tenseChip(t){
  t = t || "";
  if(/passé|expérience|habitude/i.test(t)) return "blue";
  if(/futur|souhait/i.test(t)) return "green";
  if(/hypoth|conseil|probab|comparaison/i.test(t)) return "amber";
  return "brand";
}
function escapeHtml(s){ return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
let toastT;
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1800);
}
function buildAccentBar(barId="accents", inputId="answer"){
  const chars=["ü","1","2","3","4","，","？","！"];
  const bar=document.getElementById(barId);
  bar.innerHTML=chars.map(c=>`<button type="button" data-c="${c}">${c}</button>`).join("");
  bar.querySelectorAll("button").forEach(b=> b.onclick=()=>{
    const ta=document.getElementById(inputId);
    const p=ta.selectionStart||ta.value.length;
    ta.value=ta.value.slice(0,p)+b.dataset.c+ta.value.slice(p);
    ta.focus(); ta.selectionStart=ta.selectionEnd=p+1;
    ta.dispatchEvent(new Event("input"));
  });
}

/* ============================================================
   MODE SAISIE MOBILE (clavier ouvert)
   ============================================================ */
let typingT=null;
const isTyping = ()=>document.body.classList.contains("typing");
// Nouveau contenu : garde le clavier ouvert si on était en train de taper (même geste utilisateur)
function keepFocus(el){
  if(isTouch && !isTyping()) return;
  if(isTyping()){   // la carte doit être visible avant de pouvoir recevoir le focus
    clearTimeout(typingT);
    document.querySelectorAll(".active-card").forEach(c=>c.classList.remove("active-card"));
    const card = el.closest(".card"); if(card) card.classList.add("active-card");
  }
  el.focus({ preventScroll:true });
}
// Entrée = bouton de droite de la rangée principale (Vérifier, puis Suivante)
function enterMain(e){
  if(e.key!=="Enter" || e.shiftKey) return;
  e.preventDefault();
  const row = e.target.closest(".card").querySelector(".mainrow");
  if(row) row.querySelectorAll("button")[1].click();
}
// Après une vérification : la rangée principale reprend les actions du résultat, sans bouger
function mirrorResult(box){
  const card = box.closest(".card"), row = card && card.querySelector(".mainrow");
  if(!row) return;
  if(isTouch && !isTyping()){   // vérifié clavier fermé : même mise en page figée (phrase en haut, vérification en bas)
    document.querySelectorAll(".active-card").forEach(c=>c.classList.remove("active-card"));
    card.classList.add("active-card");
    document.body.classList.add("typing","kbclosed");
    fitTyping();
  }
  const [l, r] = row.querySelectorAll("button");
  const orig = { lt:l.textContent, lf:l.onclick, rt:r.textContent, rf:r.onclick };
  const btns = [...box.querySelectorAll(".btnrow button")];
  const next = btns.find(b=>b.classList.contains("primary"));
  const reveal = btns.find(b=>/correction|réponse/i.test(b.textContent));
  const retry = btns.find(b=>/essayer/i.test(b.textContent));
  if(next){ r.textContent = next.textContent; r.onclick = ()=>next.click(); }
  if(reveal){
    l.textContent = "Correction"; l.style.visibility = "";
    l.onclick = ()=>{
      reveal.click(); l.style.visibility = "hidden";
      const rv = box.querySelector(".reveal.show");
      if(rv) box.scrollTop += rv.getBoundingClientRect().top - box.getBoundingClientRect().top - 6;
    };
  } else { l.style.visibility = "hidden"; l.onclick = null; }
  const inp = card.querySelector("textarea.answer, input.answer");
  if(retry && inp){
    // on corrige sa réponse = nouvel essai : la rangée redevient « Vérifier »
    inp.addEventListener("input", function h(){
      inp.removeEventListener("input", h);
      box.classList.add("hidden");
      l.textContent = orig.lt; l.onclick = orig.lf; l.style.visibility = "";
      r.textContent = orig.rt; r.onclick = orig.rf;
    });
  }
}
function fitTyping(){
  if(!isTyping()) return;
  const vv = window.visualViewport;
  let h = vv ? vv.height : window.innerHeight;
  if(document.body.classList.contains("kbclosed")) h -= document.getElementById("tabs").offsetHeight;
  const st = document.documentElement.style;
  st.setProperty("--vvh", Math.floor(h) + "px");
  st.setProperty("--vvtop", Math.max(0, Math.round(vv ? vv.offsetTop : 0)) + "px");
}
// Sortie du mode exercice (changement d'onglet, fin du jour…)
function exitTyping(){
  document.body.classList.remove("typing","kbclosed");
  document.querySelectorAll(".active-card").forEach(c=>c.classList.remove("active-card"));
  const a=document.activeElement; if(a && a.classList && a.classList.contains("answer")) a.blur();
}
document.addEventListener("focusin", e=>{
  const t=e.target;
  if(!isTouch || !t.classList || !t.classList.contains("answer") || t.tagName==="SELECT") return;
  clearTimeout(typingT);
  document.querySelectorAll(".active-card").forEach(c=>c.classList.remove("active-card"));
  const card=t.closest(".card"); if(!card) return;
  card.classList.add("active-card");
  document.body.classList.add("typing");
  document.body.classList.remove("kbclosed");
  window.scrollTo(0,0);
  fitTyping();
  [100,300,600,1000].forEach(ms=>setTimeout(fitTyping, ms));
});
document.addEventListener("focusout", ()=>{
  if(!isTyping()) return;
  clearTimeout(typingT);
  typingT=setTimeout(()=>{
    const a=document.activeElement;
    if(a && a.classList && a.classList.contains("answer") && a.tagName!=="SELECT") return;
    document.body.classList.add("kbclosed");   // clavier fermé : on garde la mise en page
    window.scrollTo(0,0);
    fitTyping();
    [100,300,600,1000].forEach(ms=>setTimeout(fitTyping, ms));
  }, 150);
});
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", fitTyping);
  window.visualViewport.addEventListener("scroll", fitTyping);
}
// Boutons de la carte en cours : ne ferment pas le clavier
["pointerdown","mousedown"].forEach(ev=>document.addEventListener(ev, e=>{
  if(!e.target.closest) return;
  if(e.target.closest(".accents button") || (isTyping() && e.target.closest(".active-card button"))) e.preventDefault();
}));

/* ============================================================
   PROFILS
   ============================================================ */
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function renderPicker(){
  const wrap=document.getElementById("profileCards");
  wrap.innerHTML=Object.entries(PROFILES).filter(([id])=>id!=="guest").map(([id,p])=>`
    <button class="pcard" data-id="${esc(id)}" title="${esc(p.fullName||p.name)}">
      <div class="big" style="background:${esc(p.color)}">${esc(p.initial)}</div>
      <b>${esc(p.name)}</b><span>${esc(p.sub)}</span>
    </button>`).join("") + `
    <button class="pcard new" id="newProfileBtn" type="button">
      <div class="big">+</div>
      <b>Nouveau</b><span>créer un profil</span>
    </button>`;
  wrap.querySelectorAll(".pcard[data-id]").forEach(b=> b.onclick=()=>selectProfile(b.dataset.id));
  document.getElementById("newProfileBtn").onclick=openNewForm;
  const g=document.getElementById("guestBtn");
  if(g) g.onclick=()=>selectProfile("guest");
}
function slugify(str){
  return str.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
}
function createLocalProfile(first, last){
  const list = readList().length ? readList() : DEFAULT_LIST.slice();
  const dup = list.find(m => m.firstName.toLowerCase()===first.toLowerCase() && (m.lastName||"").toLowerCase()===last.toLowerCase());
  if(dup) return dup;
  const base = slugify(first + (last ? "-"+last : "")) || "profil";
  let id = base, n = 2;
  while(list.some(m => m.id===id)) id = base + "-" + n++;
  const m = { id, firstName:first, lastName:last, color: PALETTE[list.length % PALETTE.length] };
  list.push(m);
  setProfileList(list);
  return m;
}
function openNewForm(){
  document.getElementById("profileCards").classList.add("hidden");
  document.getElementById("picker").classList.add("form-open");
  const f=document.getElementById("newForm");
  f.classList.remove("hidden"); f.reset();
  document.getElementById("nfErr").textContent="";
  document.getElementById("picker").scrollTo(0,0);
  setTimeout(()=>document.getElementById("nfFirst").focus(), 50);
}
function closeNewForm(){
  document.getElementById("newForm").classList.add("hidden");
  document.getElementById("picker").classList.remove("form-open");
  document.getElementById("profileCards").classList.remove("hidden");
}
// Quand le clavier s'ouvre (iOS ne redimensionne pas la page), on garde le champ actif visible
["nfFirst","nfLast"].forEach(id=>{
  document.getElementById(id).addEventListener("focus", ev=>{
    setTimeout(()=>{ try{ ev.target.scrollIntoView({ block:"center", behavior:"smooth" }); }catch(e){} }, 250);
  });
});
document.getElementById("nfCancel").onclick=closeNewForm;
document.getElementById("newForm").onsubmit=async (ev)=>{
  ev.preventDefault();
  const first=document.getElementById("nfFirst").value.trim();
  const last=document.getElementById("nfLast").value.trim();
  const err=document.getElementById("nfErr"); const btn=document.getElementById("nfSubmit");
  err.textContent="";
  if(first.length<2){ err.textContent="Le prénom doit faire au moins 2 caractères."; return; }
  btn.disabled=true;
  try{
    let created;
    if(API===false){
      created = createLocalProfile(first, last);           // hébergement statique : profil local à cet appareil
    }else{
      const r=await fetch("/api/profiles",{ method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ firstName:first, lastName:last }) });
      const j=await r.json().catch(()=>({}));
      if(r.status===409 && j.profile){ err.textContent="Ce profil existe déjà, ouverture..."; }
      else if(!r.ok){ throw new Error(j.error || "Erreur serveur ("+r.status+")"); }
      created = j.profile;
      await loadProfileList();
    }
    renderPicker();
    closeNewForm();
    selectProfile(created.id);
  }catch(e){
    err.textContent = navigator.onLine ? (e.message||"Impossible de créer le profil.") : "Hors-ligne : impossible de créer un profil.";
  }finally{ btn.disabled=false; }
};
async function selectProfile(id){
  current=id;
  try{ localStorage.setItem(CUR_KEY, id); }catch(e){}
  // récupère la progression depuis le serveur (repli cache si hors-ligne)
  let data = await fetchProfileState(id);
  if(!data) data = blankProfile();
  if(!state.profiles) state.profiles={};
  state.profiles[id]=data;
  writeCache();
  document.getElementById("picker").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("tabs").classList.remove("hidden");
  const p=PROFILES[id];
  document.getElementById("whoName").textContent=p.name;
  const av=document.getElementById("whoAv"); av.textContent=p.initial; av.style.background=p.color;
  exIndex=0; switchTab("today");
}
document.getElementById("whoBtn").onclick=()=>{
  if(current){ clearTimeout(saveTimer); pushState(); }   // flush le profil courant avant de switcher
  document.getElementById("app").classList.add("hidden");
  document.getElementById("tabs").classList.add("hidden");
  document.getElementById("picker").classList.remove("hidden");
};

/* ============================================================
   INIT
   ============================================================ */
try{ current = localStorage.getItem(CUR_KEY); }catch(e){ current = null; }
try{ localStorage.setItem(LANG_KEY, LANG); }catch(e){}
(function(){   // profil transmis par le sélecteur de langue
  const p = new URLSearchParams(location.search).get("p");
  if(p){ current = p; history.replaceState(null, "", location.pathname); }
})();
(async ()=>{
  await loadProfileList();
  renderPicker();
  if(current && PROFILES[current]) selectProfile(current);
  else current = null;
  flushDirty();
  // Mise en cache automatique de toute l'app pour le hors-ligne
  if("serviceWorker" in navigator){
    if(navigator.serviceWorker.controller){ swReady = true; }
    registerSW();
  }
})();
</script>
