<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content, maximum-scale=1, user-scalable=no">
<title>Xué Zhōngwén · 学中文</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#d6342b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="学中文">
<style>
  :root{
    --bg:#f6f7fb; --card:#ffffff; --ink:#1d2433; --muted:#7b8496;
    --line:#e8ebf2; --brand:#d6342b; --brand-soft:#fdeceb;
    --green:#12a150; --green-soft:#e6f6ec;
    --amber:#e0a800; --amber-soft:#fcf3d9;
    --blue:#2f6fe8; --blue-soft:#e9f0ff;
    --radius:18px; --shadow:0 6px 22px rgba(29,36,51,.06);
    --font:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,textarea,select{font-family:inherit}

  /* ---------- LAYOUT ---------- */
  .app{max-width:720px;margin:0 auto;padding:0 16px 120px;min-height:100%}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(246,247,251,.85);backdrop-filter:blur(10px);
    display:flex;align-items:center;justify-content:space-between;padding:14px 2px;margin-bottom:6px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.3px}
  .brand .dot{width:26px;height:26px;border-radius:9px;background:var(--brand);display:grid;place-items:center;color:#fff;font-size:15px}
  .who{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
    padding:5px 6px 5px 10px;border-radius:999px;box-shadow:var(--shadow)}
  .who .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px}
  .who small{font-weight:700;font-size:13px}
  .who svg{opacity:.5}

  /* ---------- PROFILE PICKER ---------- */
  .overlay{position:fixed;inset:0;background:linear-gradient(160deg,#fff,#f0f2f9);z-index:50;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;
    overflow-y:auto;-webkit-overflow-scrolling:touch}
  .overlay.form-open{justify-content:flex-start;padding-top:max(28px, env(safe-area-inset-top))}
  .overlay.form-open h1{font-size:24px}
  .overlay.form-open p{margin-bottom:18px}
  .overlay.form-open #guestBtn,.overlay.form-open #guestBtn + div,.overlay.form-open a{display:none}
  .overlay h1{font-size:30px;letter-spacing:-1px;margin-bottom:6px}
  .overlay p{color:var(--muted);margin-bottom:28px;max-width:340px}
  .profiles{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
  .pcard{width:150px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 16px;
    box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
  .pcard:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(29,36,51,.12)}
  .pcard .big{width:66px;height:66px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;
    color:#fff;font-weight:800;font-size:26px}
  .pcard b{font-size:17px}
  .pcard span{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
  .pcard.new{border-style:dashed;background:transparent;box-shadow:none}
  .pcard.new .big{background:#fff;color:var(--muted);border:2px dashed var(--line);font-size:30px;font-weight:600}
  .pcard.new:hover{box-shadow:none;background:var(--card)}
  .newform{width:min(100%,340px);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 20px;box-shadow:var(--shadow);text-align:left}
  .newform h2{font-size:18px;letter-spacing:-.3px;margin-bottom:14px;text-align:center}
  .newform label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 5px}
  .newform input{width:100%;font-family:inherit;font-size:16px;font-weight:600;color:#1d2433;background:#f6f7fb;border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
  .newform input:focus{border-color:var(--brand);background:#fff}
  .newform .row{display:flex;gap:10px;margin-top:18px}
  .newform button{flex:1;font-family:inherit;font-weight:800;font-size:14px;padding:12px;border-radius:999px;cursor:pointer;border:1px solid var(--line);background:#fff;color:#1d2433}
  .newform button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .newform button:disabled{opacity:.55;cursor:default}
  .newform .err{color:#d63384;font-size:12.5px;font-weight:700;margin-top:10px;min-height:16px}

  /* ---------- TABS ---------- */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.92);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
  .tab{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);
    font-weight:700;font-size:10.5px;padding:6px 2px;border-radius:12px;text-align:center}
  .tab svg{width:21px;height:21px}
  .tab.active{color:var(--brand)}
  .tab.active svg{stroke:var(--brand)}

  /* ---------- CARDS ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
  .card + .card{margin-top:14px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
  .chip.brand{background:var(--brand-soft);color:var(--brand)}
  .chip.blue{background:var(--blue-soft);color:var(--blue)}
  .chip.green{background:var(--green-soft);color:var(--green)}
  .chip.amber{background:var(--amber-soft);color:#a37b00}
  .chip.gray{background:#eef0f5;color:var(--muted)}

  /* ---------- DAY HEADER ---------- */
  .dayhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .dayhead .nav{display:flex;align-items:center;gap:8px}
  .iconbtn{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);
    display:grid;place-items:center;box-shadow:var(--shadow);color:var(--ink)}
  .iconbtn:disabled{opacity:.35;cursor:not-allowed}
  .daytitle{text-align:center}
  .daytitle b{font-size:15px}
  .daytitle small{display:block;color:var(--muted);font-size:12px}

  .progresswrap{margin:2px 0 16px}
  .bar{height:9px;border-radius:999px;background:#eef0f5;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand),#f5854f);transition:width .4s}
  .progresswrap small{display:block;text-align:right;color:var(--muted);font-size:12px;margin-top:5px;font-weight:600}

  /* ---------- EXERCISE ---------- */
  .ex-count{font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between}
  .prompt-label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
  .prompt{font-size:23px;font-weight:800;letter-spacing:-.4px;margin-bottom:18px}
  .answer{width:100%;border:2px solid var(--line);border-radius:14px;padding:14px 15px;font-size:17px;
    background:#fbfcfe;transition:border-color .15s;resize:none}
  .answer:focus{outline:none;border-color:var(--brand);background:#fff}
  .accents{display:flex;gap:5px;margin-top:10px}
  .accents button{flex:1;min-width:0;max-width:44px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:16px;color:var(--ink)}
  .accents button:active{background:var(--brand-soft)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:14px;
    font-weight:800;font-size:16px;transition:transform .1s,filter .1s}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn.soft{background:#eef0f5;color:var(--ink)}
  .btnrow{display:flex;gap:10px;margin-top:14px}
  .btnrow .btn{flex:1}
  .result .btnrow{display:none}   /* les actions du résultat passent dans la rangée principale (qui ne bouge pas) */

  /* ---------- RESULT ---------- */
  .result{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}
  .verdict{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;margin-bottom:12px}
  .verdict .badge{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
  .yourline{font-size:19px;font-weight:700;margin-bottom:6px;word-spacing:1px}
  .w{border-radius:6px;padding:1px 4px;margin:0 1px;display:inline-block}
  .w.ok{background:var(--green-soft);color:var(--green)}
  .w.typo{background:#fff1e0;color:#d9730d;text-decoration:underline solid #f08c2e;text-underline-offset:3px;text-decoration-thickness:2px}
  .w.bad{background:var(--amber-soft);color:#a37b00;text-decoration:underline wavy #e0a800}
  .hint-msg{font-size:14px;color:var(--muted);margin-top:4px}
  .reveal{margin-top:14px;padding:14px;border-radius:12px;background:var(--green-soft);border:1px solid #cde ;display:none}
  .reveal.show{display:block}
  .reveal .lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--green);margin-bottom:4px}
  .reveal .es{font-size:20px;font-weight:800;color:#0d7a3d}
  .reveal .tip{font-size:13.5px;color:#3a6b4e;margin-top:8px;line-height:1.45}
  .miss{margin-top:10px;font-size:13.5px;color:#a37b00}
  .miss b{background:var(--amber-soft);padding:1px 6px;border-radius:6px;margin:0 2px;display:inline-block}

  /* ---------- DAYS LIST ---------- */
  .daylist{display:flex;flex-direction:column;gap:10px}
  .dayrow{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);text-align:left;width:100%}
  .dayrow .num{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;flex:none;font-size:15px}
  .dayrow.locked{opacity:.55}
  .dayrow .meta{flex:1;min-width:0}
  .dayrow .meta b{font-size:15px;display:block}
  .dayrow .meta small{color:var(--muted);font-size:12.5px}
  .dayrow .stat{flex:none;font-size:12px;font-weight:800}

  /* ---------- VOCAB ---------- */
  .vhead{display:flex;gap:10px;margin-bottom:16px}
  .vstat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center;box-shadow:var(--shadow)}
  .vstat .n{font-size:28px;font-weight:800;letter-spacing:-1px}
  .vstat small{color:var(--muted);font-size:12px;font-weight:700}
  .vstat.g .n{color:var(--green)} .vstat.a .n{color:var(--amber)}
  .seg{display:flex;background:#eef0f5;border-radius:12px;padding:4px;margin-bottom:14px}
  .seg button{flex:1;padding:9px;border-radius:9px;font-weight:800;font-size:13.5px;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.06)}
  .words{display:flex;flex-wrap:wrap;gap:8px}
  .word{display:inline-flex;flex-direction:column;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:9px 13px;box-shadow:var(--shadow)}
  .word b{font-size:15px}
  .word small{font-size:11px;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px}
  .empty .big{font-size:40px;margin-bottom:10px}

  /* ---------- TABLEAUX DE CONJUGAISON ---------- */
  .thint{font-size:12px;color:var(--muted);margin:0 2px 9px;font-weight:600;display:flex;align-items:center;gap:6px}
  .tscroll{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;padding:2px 2px 12px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
  .tscroll::-webkit-scrollbar{height:7px}
  .tscroll::-webkit-scrollbar-thumb{background:#d7dbe6;border-radius:99px}
  .tcol{flex:0 0 auto;min-width:248px;max-width:300px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);overflow:hidden;scroll-snap-align:start}
  .tcol .th{display:block;text-align:center;padding:11px 10px;font-size:13px;font-weight:800}
  .tcol table{width:100%;border-collapse:collapse}
  .tcol td{padding:8px 12px;font-size:14px;border-top:1px solid var(--line);vertical-align:top}
  .tcol td.pr{color:var(--muted);font-weight:600;white-space:nowrap;font-size:12.5px}
  .tcol td.fm{font-weight:800}
  .tcol .frr{display:block;color:var(--muted);font-size:11.5px;font-weight:500;font-style:italic;line-height:1.3;margin-top:1px}
  .tex{border-top:1px dashed var(--line);padding:10px 12px 12px;background:#fbfcfe}
  .tex-es{font-weight:800;font-size:14px;line-height:1.35}
  .tex-fr{color:var(--muted);font-size:12px;font-style:italic;margin-top:3px;line-height:1.35}
  .exnum{display:inline-flex;align-items:center;gap:6px}
  .backex{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);
    font-size:22px;line-height:1;font-weight:700;display:inline-grid;place-items:center;padding-bottom:2px;margin:-4px 2px -4px 0}
  .th.t-brand{background:var(--brand-soft);color:var(--brand)}
  .th.t-blue{background:var(--blue-soft);color:var(--blue)}
  .th.t-green{background:var(--green-soft);color:var(--green)}
  .th.t-amber{background:var(--amber-soft);color:#a37b00}
  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;
    box-shadow:0 8px 24px rgba(0,0,0,.25);transition:.25s;z-index:40;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .celebrate{text-align:center;padding:30px 10px}
  .celebrate .big{font-size:52px;margin-bottom:10px}
  .celebrate h3{font-size:22px;letter-spacing:-.5px;margin-bottom:6px}
  .celebrate p{color:var(--muted);margin-bottom:20px}

  .notes{margin:0 0 14px}
  .notes summary{cursor:pointer;font-weight:800;font-size:14px;list-style:none;display:flex;align-items:center;gap:8px}
  .notes summary::-webkit-details-marker{display:none}
  .notes summary .chip{margin-left:auto}
  .notes ul{margin:12px 0 0 18px;font-size:13.5px;color:#3d4556;display:flex;flex-direction:column;gap:6px}
  .offline{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .offline .ic{font-size:30px}
  .offline small{display:block;color:var(--muted);font-size:12.5px}
  .offline .btn{width:auto;padding:10px 14px;font-size:13px;flex:none}
  /* Mode saisie (mobile) : clavier ouvert = seule la carte en cours reste, collée en haut */
  body.typing .tabs, body.typing .topbar, body.typing .toast{display:none!important}
  body.typing .app{padding-bottom:0}
  body.typing .app > section > :not(.active-card){display:none!important}
  body.typing{overflow:hidden}
  /* carte accrochée à la zone visible (visualViewport) : l'iPhone ne peut plus la décaler */
  body.typing .active-card{position:fixed;left:12px;right:12px;z-index:25;margin:0;
    top:calc(var(--vvtop, 0px) + 8px);height:calc(var(--vvh, 100dvh) - 16px);
    padding:12px 14px;display:flex;flex-direction:column;overflow:hidden}
  body.typing .active-card > *{flex:none}
  body.typing .active-card .ex-count{margin-bottom:6px}
  body.typing .active-card .prompt{font-size:19px;margin-bottom:8px}
  /* ordre : phrase (haut) · réponse · accents · … · vérification + boutons (bas, au-dessus du clavier) */
  body.typing .active-card .answer{order:1}
  body.typing .active-card .answer{flex:1 1 auto;min-height:52px;height:auto}
  body.typing .active-card .prompt-label{display:none}
  body.typing .active-card .accents{order:2;padding-top:8px;margin-top:0}
  body.typing .active-card .result{order:3;margin-top:8px;padding-top:8px;overflow-y:auto;flex:0 1 auto;min-height:0;max-height:62%}
  /* clavier fermé : même mise en page, le menu du bas revient */
  body.typing.kbclosed .tabs{display:flex!important}
  body.typing .active-card .result .verdict{font-size:14px;margin-bottom:6px}
  body.typing .active-card .result .yourline{font-size:16px;margin-bottom:2px}
  body.typing .active-card .result .reveal{margin-top:8px;padding:10px}
  body.typing .active-card .result .reveal .es{font-size:17px}
  body.typing .active-card .result:has(.reveal.show) .miss-msg{display:none}
  body.typing .active-card .mainrow{order:4;margin-top:8px}
  body.typing .active-card .btn{padding:12px}
  /* chinois */
  .zh{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",var(--font)}
  /* caractère + pinyin au-dessus, chaque bloc prend la largeur du plus large */
  ruby{display:inline-flex;flex-direction:column-reverse;align-items:center;vertical-align:bottom;margin:0 .06em;line-height:1.15}
  rt{display:block;font-size:.5em;font-weight:600;color:var(--muted);letter-spacing:0;line-height:1.1;white-space:nowrap}
  .es.zh{line-height:1.5}
  .zhbig{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC",var(--font);font-size:64px;font-weight:600;line-height:1.1;text-align:center}
  body.typing .active-card .prompt.zhbig{font-size:52px}
  .spk{border:1px solid var(--line);background:#fff;border-radius:9px;padding:2px 7px;font-size:14px;vertical-align:middle;margin-left:4px}
  .gfiche summary{cursor:pointer;font-weight:800;font-size:15px;list-style:none;display:flex;align-items:center;gap:8px;justify-content:space-between}
  .gfiche summary::-webkit-details-marker{display:none}
  .grule{font-size:14px;color:#3d4556;margin:12px 0}
  .gex{display:flex;flex-direction:column;gap:10px}
  .gex .zh{font-size:19px;font-weight:700;line-height:1.5}
  .gex small{color:var(--muted);font-size:12.5px}
  .gfiche + .gfiche{margin-top:10px}
  .blank{display:inline-block;min-width:1.6em;text-align:center;border-bottom:3px solid var(--brand);margin:0 3px;color:var(--brand)}
  .blank.ok{border-color:var(--green);color:var(--green)} .blank.ko{border-color:var(--amber);color:#a37b00}
  .qopts{display:flex;gap:10px;flex-wrap:wrap}
  .qopt{flex:1;min-width:80px;padding:14px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:22px;font-weight:700;font-family:"PingFang SC","Noto Sans SC",var(--font)}
  .qopt.ok{border-color:var(--green);background:var(--green-soft);color:var(--green)}
  .qopt.ko{border-color:var(--amber);background:var(--amber-soft);color:#a37b00}
  .tgrid{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .tcolz{display:flex;flex-direction:column;align-items:center;gap:6px}
  .tpy{font-size:18px;font-weight:700;color:var(--muted)} .tpy.ok{color:var(--green)} .tpy.ko{color:#d9730d}
  .tbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
  .tbtn{width:44px;height:48px;border-radius:10px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .tbtn b{font-size:17px} .tbtn small{font-size:9px;color:var(--muted)}
  .tbtn.on{border-color:var(--brand);background:var(--brand-soft)}
  .tbtn.right{border-color:var(--green);background:var(--green-soft)}
  .hzgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .hz{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:var(--shadow)}
  .hz b{font-size:30px;font-weight:600;font-family:"PingFang SC","Noto Sans SC",var(--font)}
  .hz span{font-size:13px;font-weight:700;color:var(--brand)}
  .hz small{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.2}
  .hz.ok{border-color:#bfe6cf;background:var(--green-soft)} .hz.ko{border-color:#f3dfa8}
  .word b.zhw{font-size:22px;font-family:"PingFang SC","Noto Sans SC",var(--font)}
  .langsw{display:inline-flex;background:#eef0f5;border-radius:999px;padding:4px;margin-bottom:18px;gap:2px}
  .langsw button{padding:8px 14px;border-radius:999px;font-weight:800;font-size:13.5px;color:var(--muted)}
  .langsw button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
  .toplang{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);font-size:18px;display:grid;place-items:center}
  .topright{display:flex;align-items:center;gap:8px}
  .hidden{display:none!important}
  @media(max-width:400px){ .prompt{font-size:20px} .overlay h1{font-size:25px} }
</style>

<body>

<div class="tabs hidden" id="tabs">

    <svg viewBox="0 0 24 24" fill="none" stroke="#7b8496" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z"/></svg>

  </button>

    Parcours

<div class="toast" id="toast"></div>

<script src="pinyin-pro.js?v=1"></script>
<script src="zh.js?v=1"></script>

<script src="lexique.js?v=1"></script>
<script src="grammaire.js?v=1"></script>
<script>
/* ============================================================
   LANGUE (même app : espagnol à la racine, chinois dans /zh/)
   ============================================================ */
const LANG = "zh";
const LANG_KEY = "aprende_lang";
function goLang(l){
  if(l===LANG) return;
  try{ localStorage.setItem(LANG_KEY, l); }catch(e){}
  if(typeof current!=="undefined" && current && current!=="guest"){ clearTimeout(saveTimer); pushState(); }
  const q = (typeof current!=="undefined" && current) ? "?p=" + encodeURIComponent(current) : "";
  location.href = (LANG==="zh" ? "../" : "./") + (l==="zh" ? "zh/" : "") + q;
}

/* ============================================================
   ÉTAT & PROFILS
   ============================================================ */
// Liste des profils : servie par l'API (/api/profiles), miroir local pour le hors-ligne.
const isTouch = window.matchMedia("(pointer:coarse)").matches;
const GUEST = { name:"Invité", color:"#7b8496", initial:"?", sub:"local, non synchronisé" };
const TAGLINES = { dylan:"加油！", rebecca:"你好！" };
const LIST_KEY = "aprende_profiles_v1";   // liste des profils partagée avec l'espagnol
const API_STATE = "/api/zh/state/";         // progression chinoise séparée côté serveur
const OLD_KEY  = "xue_old_v0";      // ancien format statique : {profiles:{dylan,rebecca}, current}
const DEFAULT_LIST = [
  { id:"dylan",   firstName:"Dylan",   lastName:"", color:"#2f6fe8" },
  { id:"rebecca", firstName:"Rebecca", lastName:"", color:"#e8542f" },
];
const PALETTE = ["#2f6fe8","#e8542f","#1fa66b","#8b5cf6","#e0a100","#0ea5b7","#d63384","#f97316"];
// API : true = serveur dispo, false = hébergement statique (pas d'API), null = hors-ligne
let API = null;
let PROFILES = { guest: GUEST };
function readList(){ try{ return JSON.parse(localStorage.getItem(LIST_KEY)) || []; }catch(e){ return []; } }
function metaToCard(m){
  const name = m.firstName;
  return {
    name,
    fullName: m.lastName ? m.firstName+" "+m.lastName : m.firstName,
    color: m.color,
    initial: (m.firstName[0]||"?").toUpperCase(),
    sub: m.lastName || TAGLINES[m.id] || "你好！",
  };
}
function setProfileList(list){
  PROFILES = { guest: GUEST };
  list.forEach(m => { PROFILES[m.id] = metaToCard(m); });
  try{ localStorage.setItem(LIST_KEY, JSON.stringify(list)); }catch(e){}
}
async function loadProfileList(){
  try{
    const r = await fetch("/api/profiles", { cache:"no-store" });
    const j = r.ok ? await r.json() : null;
    if(!j || !Array.isArray(j.profiles)) throw { staticHost:true };
    API = true;
    setProfileList(j.profiles);
  }catch(e){
    // hébergement statique (here.now) ou hors-ligne : liste locale, profils par défaut au premier lancement
    API = (e && e.staticHost) ? false : null;
    const cached = readList();
    setProfileList(cached.length ? cached : DEFAULT_LIST);
  }
}
function isGuest(){ return current === "guest"; }
const ACQUIRE_AT = 2;              // nb de bonnes réponses pour "acquis"
// Données côté serveur (base SQLite) + miroir local pour le hors-ligne.
const CACHE_KEY = "xue_cache_v1";   // miroir local des profils
const CUR_KEY   = "xue_current";    // profil actif sur CET appareil
// Reprise de l'ancienne progression statique (clé xue_old_v0) dans le miroir local, une seule fois
(function importOldStore(){
  try{
    if(localStorage.getItem(CACHE_KEY)) return;
    const old = JSON.parse(localStorage.getItem(OLD_KEY));
    if(old && old.profiles) localStorage.setItem(CACHE_KEY, JSON.stringify(old.profiles));
  }catch(e){}
})();
let state = { profiles:{}, current:null };
let current = null;
let activeTab = "today";

function readCache(){ try{ return JSON.parse(localStorage.getItem(CACHE_KEY)) || {} }catch(e){ return {} } }
function writeCache(){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify(state.profiles||{})); }catch(e){} }
function profile(){ return state.profiles[current]; }
function blankProfile(){ return { day:1, done:{}, vocab:{}, streak:0 }; }

// Sauvegarde : miroir local immédiat + envoi serveur débounce.
// Hors-ligne (avion) : les profils modifiés sont marqués « à synchroniser »
// et envoyés dès que le réseau revient.
const DIRTY_KEY = "xue_dirty_v1";
function readDirty(){ try{ return JSON.parse(localStorage.getItem(DIRTY_KEY)) || {}; }catch(e){ return {}; } }
function setDirty(id, on){
  const d = readDirty();
  if(on) d[id] = true; else delete d[id];
  try{ localStorage.setItem(DIRTY_KEY, JSON.stringify(d)); }catch(e){}
}
let saveTimer=null;
function save(){
  if(current && state.profiles[current]) state.profiles[current]._ts = Date.now();
  writeCache();
  if(!current || isGuest() || API===false) return;   // invité / statique = local seulement
  setDirty(current, true);
  clearTimeout(saveTimer);
  saveTimer=setTimeout(pushState, 600);
}
async function pushProfile(id, data){
  const r = await fetch(API_STATE+id, {
    method:"PUT",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ state: data }),
  });
  if(!r.ok) throw new Error("http "+r.status);
  setDirty(id, false);
}
async function pushState(){
  if(!current || isGuest() || API===false) return;
  try{ await pushProfile(current, state.profiles[current]); }
  catch(e){ /* reste marqué à synchroniser, renvoyé au retour du réseau */ }
  refreshSyncBadge();
}
// Envoie tous les profils modifiés hors-ligne
async function flushDirty(){
  if(API!==true) return;
  const d = readDirty(), c = readCache();
  for(const id of Object.keys(d)){
    if(!c[id]){ setDirty(id, false); continue; }
    try{ await pushProfile(id, c[id]); }catch(e){ break; }
  }
  refreshSyncBadge();
}
window.addEventListener("online", async ()=>{
  if(API!==false){ await loadProfileList(); await flushDirty(); }
});
// Flush au moment où l'on quitte/masque la page (fiabilise la synchro)
function flushNow(){
  if(!current || isGuest() || API===false || !state.profiles[current]) return;
  try{
    const body = JSON.stringify({ state: state.profiles[current] });
    if(navigator.onLine && navigator.sendBeacon){
      navigator.sendBeacon(API_STATE+current, new Blob([body], {type:"application/json"}));
    }
  }catch(e){}
}
window.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") flushNow(); });
window.addEventListener("pagehide", flushNow);

async function fetchProfileState(id){
  if(id==="guest" || API===false){ const c=readCache(); return c[id] || null; }   // invité / statique = local
  try{
    const r = await fetch(API_STATE+id, { cache:"no-store" });
    if(!r.ok) throw new Error("http "+r.status);
    const j = await r.json();
    // Progression faite hors-ligne et pas encore envoyée : la version locale gagne
    const local = readCache()[id];
    if(local && readDirty()[id] && (!j.state || (local._ts||0) >= (j.state._ts||0))){
      pushProfile(id, local).catch(()=>{});
      return local;
    }
    return j.state; // peut être null (profil jamais joué)
  }catch(e){
    const c = readCache(); return c[id] || null; // repli hors-ligne
  }
}

/* ============================================================
   CORRECTION (moteur chinois : zh.js)
   ============================================================ */
function norm(w){ return String(w).toLowerCase(); }
function evaluate(userText, accepted){ return ZH.evaluate(userText, accepted); }

/* ============================================================
   VOCABULAIRE
   ============================================================ */
function updateVocab(res){
  const v = profile().vocab;
  res.refTok.forEach((w,k)=>{
    if(!ZH.isHan(w)) return;
    const key = norm(w);
    if(!v[key]) v[key] = { es:w, ok:0, ko:0 };
    else v[key].es = w; // garde la forme accentuée de référence
    if(res.refMatched[k]) v[key].ok++;
    else v[key].ko++;
  });
  save();
}
function wordStatus(rec){ return rec.ok>=ACQUIRE_AT && rec.ok>rec.ko ? "acquis" : "revoir"; }

/* ============================================================
   RENDU — AUJOURD'HUI
   ============================================================ */
let exIndex = 0;
let attempt = 0;   // nb d'essais sur la phrase affichée (seul le 1er compte)
let exHistory = []; // phrases déjà affichées dans ce jour (flèche ‹ pour revenir)
let forceShow = false; // on revient sur une phrase déjà validée : l'afficher quand même
function resetExHistory(){ exHistory = []; forceShow = false; }

/* Progression d'un jour :
   cleared[i] = phrase validée (juste du premier coup, sur un passage)
   first[i]   = juste du premier coup dès sa toute première apparition
   answered[i]= déjà proposée au moins une fois
   Une phrase ratée revient (après les autres) jusqu'à être juste du premier coup. */
function dayRec(dayNum, create){
  const done = profile().done;
  let rec = done[dayNum];
  if(!rec){
    if(!create) return null;
    rec = done[dayNum] = { correct:0, answered:{}, correctMap:{} };
  }
  if(!rec.answered) rec.answered = {};
  if(!rec.cleared){   // ancien format : seules les phrases justes sont validées, les ratées reviennent
    rec.cleared = Object.assign({}, rec.correctMap||{});
    rec.first = Object.assign({}, rec.correctMap||{});
  }
  if(!rec.first) rec.first = {};
  return rec;
}
function countIn(map, total){ let n=0; for(let i=0;i<total;i++) if(map && map[i]) n++; return n; }
function currentDayData(){
  const d = profile().day;
  return CURRICULUM.find(x=>x.day===d) || CURRICULUM[CURRICULUM.length-1];
}
function dayScore(dayNum){
  const day = CURRICULUM.find(x=>x.day===dayNum), rec = dayRec(dayNum);
  return rec ? countIn(rec.cleared, day.sentences.length) : 0;
}
function dayCompleted(dayNum){
  const day = CURRICULUM.find(x=>x.day===dayNum);
  return dayScore(dayNum) >= day.sentences.length;
}
// prochaine phrase non validée après "from" (on reboucle), -1 si tout est validé
function nextPending(day, from){
  const rec = dayRec(day.day) || { cleared:{} };
  const pend = day.sentences.map((_,i)=>i).filter(i=>!rec.cleared[i]);
  if(!pend.length) return -1;
  return pend.find(i=>i>from) ?? pend[0];
}

function renderToday(){
  if(reviewActive){ renderReview(); return; }
  const day = currentDayData();
  const dayNum = day.day;
  const total = day.sentences.length;
  const rec = dayRec(dayNum) || { cleared:{}, answered:{}, first:{} };
  const clearedCount = countIn(rec.cleared, total);
  const toRedo = day.sentences.filter((_,i)=>rec.answered[i] && !rec.cleared[i]).length;
  const el = document.getElementById("view-today");

  if(clearedCount>=total && !forceShow){
    exitTyping();
    el.innerHTML = reviewBannerHTML() + celebrateHTML(day, rec);
    bindReviewBanner();
    bindCelebrate();
    return;
  }
  if(exIndex<0 || exIndex>=total || (rec.cleared[exIndex] && !forceShow)) exIndex = nextPending(day, exIndex<0?-1:exIndex-1);
  attempt = 0;
  const s = day.sentences[exIndex];
  const redo = rec.answered[exIndex] && !rec.cleared[exIndex];
  const isFirstDay = dayNum===1, isLastDay = dayNum===CURRICULUM[CURRICULUM.length-1].day;

  el.innerHTML = `
    ${reviewBannerHTML()}
    <div class="dayhead">
      <div class="nav">
        <button class="iconbtn" id="prevDay" ${isFirstDay?"disabled":""}>${chev("left")}</button>
      </div>
      <div class="daytitle">
        <b>${dayLabel(day)} · ${day.theme}</b>
        <small>${total} phrases · ${day.tense}</small>
      </div>
      <div class="nav">
        <button class="iconbtn" id="nextDay" ${isLastDay?"disabled":""}>${chev("right")}</button>
      </div>
    </div>

    <div class="progresswrap">
      <div class="bar"><i style="width:${Math.round(clearedCount/total*100)}%"></i></div>
      <small>${clearedCount}/${total} validées${toRedo?` · ${toRedo} à refaire`:""}</small>
    </div>
    ${notesHTML(day)}

    <div class="card">
      <div class="ex-count">
        <span class="exnum">${exHistory.length?`<button class="backex" id="prevEx" aria-label="Phrase précédente">‹</button>`:""}Phrase ${exIndex+1} / ${total}${redo?` · <span style="color:#a37b00">🔁 à refaire</span>`:""}${forceShow&&rec.cleared[exIndex]?` · <span style="color:var(--green)">✓ déjà validée</span>`:""}</span>
        <span class="chip ${tenseChip(s.tag)}">${s.tag}</span>
      </div>
      <div class="prompt-label">Traduis en chinois</div>
      <div class="prompt">${escapeHtml(s.fr)}</div>

      <textarea class="answer" id="answer" rows="2" placeholder="Pinyin ou caractères…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send"></textarea>
      <div class="accents" id="accents"></div>

      <div class="btnrow mainrow">
        <button class="btn soft" id="skipBtn" style="flex:.5">Passer</button>
        <button class="btn primary" id="checkBtn">Vérifier</button>
      </div>

      <div class="result hidden" id="result"></div>
    </div>
  `;
  buildAccentBar("accents","answer");
  bindReviewBanner();
  document.getElementById("prevDay").onclick = ()=>changeDay(-1);
  document.getElementById("nextDay").onclick = ()=>changeDay(1);
  document.getElementById("checkBtn").onclick = doCheck;
  document.getElementById("skipBtn").onclick = ()=>{ nextEx(); };
  const pb = document.getElementById("prevEx"); if(pb) pb.onclick = prevEx;
  const ta = document.getElementById("answer");
  keepFocus(ta);
  ta.addEventListener("keydown", enterMain);
}

function doCheck(){
  const day = currentDayData();
  const s = day.sentences[exIndex];
  const ta = document.getElementById("answer");
  const val = ta.value.trim();
  if(!val){ toast("Écris une réponse d'abord ✍️"); return; }
  attempt++;
  const res = evaluate(val, s.zh);
  const dayNum = day.day;
  const rec = dayRec(dayNum, true);
  const firstAppearance = !rec.answered[exIndex];
  rec.answered[exIndex] = true;
  const mk = "t|"+dayNum+"|"+exIndex;
  if(attempt===1){
    updateVocab(res);
    if(res.perfect){
      rec.cleared[exIndex] = true;
      rec.correctMap[exIndex] = true;
      if(firstAppearance) rec.first[exIndex] = true;
      resolveMistake(mk);
    } else {
      delete rec.cleared[exIndex];   // phrase revue et ratée : elle revient
      logMistake({ type:"t", k:mk, fr:s.fr, es:s.zh, tip:s.tip, tense:s.tag, last:val });
    }
  }
  rec.correct = countIn(rec.first, day.sentences.length);
  save();
  renderResult(res, s);
  const box = document.getElementById("result");
  if(!document.body.classList.contains("typing")) setTimeout(()=>box.scrollIntoView({block:"center", behavior:"smooth"}), 60);
}

function typoHTML(res){
  if(!res.typos || !res.typos.length) return "";
  return `<div class="hint-msg">✍️ Petite faute (ton ou caractère homophone, en orange), pas à refaire : ${res.typos.map(t=>`<b style="color:#d9730d">${escapeHtml(t.u)}</b> → <b>${escapeHtml(t.r)}</b>`).join(", ")}</div>`;
}
function userLineHTML(res){
  return res.userTok.map((w,i)=>
    `<span class="w ${res.userTypo[i]>=0?"typo":res.userMark[i]?"ok":"bad"}">${escapeHtml(w)}</span>`
  ).join(" ");
}

function renderResult(res, s){
  const box = document.getElementById("result");
  box.classList.remove("hidden");
  const yourHtml = userLineHTML(res);
  const first = attempt===1;

  let verdict, msg="";
  if(res.perfect && first){
    verdict = `<div class="verdict"><span class="badge" style="background:var(--green)">✓</span> 太棒了 ! Phrase validée.</div>`;
    msg = typoHTML(res);
  } else if(res.perfect){
    verdict = `<div class="verdict"><span class="badge" style="background:var(--blue)">✓</span> Juste ! Elle reviendra plus tard : à valider du premier coup.</div>`;
    msg = typoHTML(res);
  } else {
    const near = res.nearPairs.length;
    const extra = res.userMark.filter(x=>!x).length - near;
    const miss = res.missing.length;
    verdict = `<div class="verdict"><span class="badge" style="background:var(--amber)">!</span> ${res.good}/${res.total} justes · ${first?"elle reviendra plus tard":"pas encore"}</div>`;
    let parts=[];
    if(extra) parts.push(`${extra} mot${extra>1?"s":""} en trop`);
    if(miss)  parts.push(`${miss} caractère${miss>1?"s":""} manquant${miss>1?"s":""}`);
    msg = `<div class="hint-msg miss-msg">${parts.join(" · ")}. Corrige ta réponse puis revérifie, ou regarde la correction.</div>` + typoHTML(res);
  }
  const lastOne = nextPending(currentDayData(), exIndex)===-1;

  box.innerHTML = `
    ${verdict}
    <div class="yourline">${yourHtml || '<span class="hint-msg">(vide)</span>'}</div>
    ${msg}
    ${(!res.perfect) ? `
      <div class="reveal" id="reveal">
        <div class="lbl">Correction</div>
        <div class="es zh">${ZH.ruby(s.zh[res.refIndex||0])} ${speakBtn(s.zh[res.refIndex||0])}</div>
        ${s.tip?`<div class="tip">💡 ${escapeHtml(s.tip)}</div>`:""}
      </div>` : `
      <div class="reveal show" style="background:var(--green-soft)">
        <div class="es zh" style="font-size:19px">${ZH.ruby(s.zh[res.refIndex||0])} ${speakBtn(s.zh[res.refIndex||0])}</div>
        ${s.tip?`<div class="tip" style="color:#3a6b4e">💡 ${escapeHtml(s.tip)}</div>`:""}
      </div>`}
    <div class="btnrow">
      ${!res.perfect?`<button class="btn ghost" id="revealBtn">Voir la correction</button>`:""}
      ${!res.perfect?`<button class="btn soft" id="retryBtn">Réessayer</button>`:""}
    </div>
    <div class="btnrow">
      <button class="btn primary" id="nextBtn">${lastOne?"Terminer le jour":"Phrase suivante"} →</button>
    </div>
  `;
  const rev = document.getElementById("revealBtn");
  if(rev) rev.onclick = ()=>{ document.getElementById("reveal").classList.add("show"); rev.remove(); };
  const retry = document.getElementById("retryBtn");
  if(retry) retry.onclick = ()=>{ box.classList.add("hidden"); document.getElementById("answer").focus(); };
  document.getElementById("nextBtn").onclick = ()=>nextEx();
  mirrorResult(box);

  if(res.perfect && first) toast("很好 ! 🎉");
}

function prevEx(){
  if(!exHistory.length) return;
  exIndex = exHistory.pop();
  forceShow = true;
  renderToday();
}
function dayLabel(day){ return "Jour "+day.day; }
function notesHTML(day){
  if(!day.notes) return "";
  return `<details class="card notes"><summary>📒 À retenir <span class="chip brand">${day.notes.length} point${day.notes.length>1?"s":""}</span></summary>
    <ul>${day.notes.map(n=>`<li>${escapeHtml(n)}</li>`).join("")}</ul>
  </details>`;
}
function nextEx(){
  if(exIndex>=0) exHistory.push(exIndex);
  forceShow = false;
  exIndex = nextPending(currentDayData(), exIndex);
  renderToday();
  if(!document.body.classList.contains("typing")) window.scrollTo({top:0,behavior:"smooth"});
}

function changeDay(dir){
  const day = currentDayData();
  const maxDay = CURRICULUM[CURRICULUM.length-1].day;
  let target = day.day + dir;
  if(target<1) target=1;
  if(target>maxDay) target=maxDay;
  if(target===day.day) return;
  profile().day = target; save();
  exIndex = 0; resetExHistory();
  renderToday();
}
function highestUnlockedDay(){
  let h=1;
  CURRICULUM.forEach(d=>{ if(dayCompleted(d.day)) h=Math.max(h,d.day+1); });
  return Math.min(h, CURRICULUM[CURRICULUM.length-1].day);
}

function celebrateHTML(day, rec){
  const maxDay = CURRICULUM[CURRICULUM.length-1].day;
  const hasNext = day.day<maxDay;
  const perfectCount = countIn(rec.first, day.sentences.length);
  return `
    <div class="dayhead">

      <h3>${dayLabel(day)} terminé !</h3>
      <p>${perfectCount}/${day.sentences.length} phrases justes dès le premier essai. ${hasNext?"Le jour suivant est débloqué.":"Tu as fini le parcours actuel. 太厉害了 !"}</p>
      <div class="btnrow" style="max-width:340px;margin:0 auto">

      </div>

}
function bindCelebrate(){
  const day = currentDayData();
  document.getElementById("prevDay").onclick=()=>changeDay(-1);
  const nd=document.getElementById("nextDay"); if(nd) nd.onclick=()=>changeDay(1);
  const rb=document.getElementById("reviewBtn");

    exIndex=0; resetExHistory(); renderToday(); window.scrollTo({top:0,behavior:"smooth"});
  };

  if(cb) cb.onclick=()=>{ profile().day=day.day+1; save(); exIndex=0; resetExHistory(); renderToday(); window.scrollTo({top:0,behavior:"smooth"}); };
}

   JOURNAL D'ERREURS (révision persistante)
   Chaque erreur reste jusqu'à ce qu'elle soit refaite juste.
   ============================================================ */
let reviewActive = false;
let reviewCurrent = null;

function mistakes(){ if(!profile().mistakes) profile().mistakes=[]; return profile().mistakes; }
function pendingCount(){ return mistakes().length; }
function logMistake(m){
  const l=mistakes(); const e=l.find(x=>x.k===m.k);
  if(e){ e.errors=(e.errors||1)+1; if(m.last) e.last=m.last; } else { m.errors=1; l.push(m); }
  save();
}
function resolveMistake(k){
  const p=k.split("|");
  if(p[0]==="t"){ const d=CURRICULUM.find(x=>x.day===Number(p[1])); if(d){ const r=dayRec(d.day,true); r.cleared[Number(p[2])]=true; } }
  const l=mistakes(); const i=l.findIndex(x=>x.k===k); if(i>=0){ l.splice(i,1); save(); } }
function bumpMistake(k){ const e=mistakes().find(x=>x.k===k); if(e){ e.errors=(e.errors||1)+1; save(); } }
function moveToEnd(k){ const l=mistakes(); const i=l.findIndex(x=>x.k===k); if(i>=0){ const [m]=l.splice(i,1); l.push(m); save(); } }

function reviewBannerHTML(){
  const p=pendingCount(); if(!p) return "";

}
function bindReviewBanner(){ const b=document.getElementById("reviewBanner"); if(b) b.onclick=startReview; }

function startReview(){ reviewActive=true; reviewCurrent=null; renderReview(); window.scrollTo({top:0}); }
function exitReview(){ reviewActive=false; renderToday(); window.scrollTo({top:0}); }

function renderReview(){
  const el=document.getElementById("view-today");

    el.innerHTML=`<div class="card celebrate"><div class="big">🎉</div>
      <h3>Aucune erreur à revoir !</h3>

      <div class="prompt-label">Écris le pinyin de ce caractère</div>

function doReviewCheck(){
  const it=reviewCurrent;
  const val=document.getElementById("revAnswer").value.trim();
  if(!val){ toast("Écris une réponse ✍️"); return; }
  const box=document.getElementById("revResult"); box.classList.remove("hidden");
  const okHead = (extra)=>`<div class="verdict"><span class="badge" style="background:var(--green)">✓</span> Corrigé ! Erreur retirée du journal.</div>${extra||""}`;
  const next = `<div class="btnrow"><button class="btn primary" id="revNext">Continuer →</button></div>`;

  if(it.type==="v" || it.type==="h"){
    const r = it.type==="v" ? lexCheck(val, { zh:it.es[0], alt:it.es.slice(1) }) : hanziCheck(val, { s:it.s, t:it.t, py:it.es[0] });
    const answerHtml = it.type==="v" ? `${ZH.ruby(it.es[0])} ${speakBtn(it.es[0])}` : `${escapeHtml(it.fr)} · ${escapeHtml(it.es[0])} ${speakBtn(it.fr)}`;
    if(r.ok){
      resolveMistake(it.k);
      box.innerHTML = okHead(r.typo ? `<div class="hint-msg">✍️ Petite faute (en orange), pas à refaire : <b style="color:#d9730d">${escapeHtml(r.typo)}</b></div>` : "")
        + `<div class="reveal show"><div class="es zh">${answerHtml}</div></div>` + next;
      toast("Erreur corrigée 🎯");
    } else {
      bumpMistake(it.k); moveToEnd(it.k);
      box.innerHTML=`<div class="verdict"><span class="badge" style="background:var(--amber)">!</span> Pas encore juste.</div>
        <div class="yourline"><span class="w bad">${escapeHtml(val)}</span></div>
        <div class="reveal show" style="background:var(--amber-soft)"><div class="lbl" style="color:#a37b00">La bonne réponse</div><div class="es zh" style="color:#a37b00">${answerHtml}</div></div>
        <div class="btnrow"><button class="btn primary" id="revNext">Suivant →</button></div>`;
    }
  } else {
    const res=evaluate(val, it.es); updateVocab(res);
    const yourHtml=userLineHTML(res);
    const ref = it.es[res.refIndex||0];
    if(res.perfect){
      resolveMistake(it.k);
      box.innerHTML = okHead(`<div class="yourline">${yourHtml}</div>${typoHTML(res)}`)
        + `<div class="reveal show"><div class="es zh">${ZH.ruby(ref)} ${speakBtn(ref)}</div></div>` + next;
      toast("Erreur corrigée 🎯");
    } else {
      bumpMistake(it.k); moveToEnd(it.k); it.last=val; save();
      const extra=res.userMark.filter(x=>!x).length, miss=res.missing.length;
      let parts=[]; if(extra)parts.push(`${extra} mot${extra>1?"s":""} en trop`); if(miss)parts.push(`${miss} caractère${miss>1?"s":""} manquant${miss>1?"s":""}`);
      box.innerHTML=`<div class="verdict"><span class="badge" style="background:var(--amber)">!</span> Pas encore · ${res.good}/${res.total}</div>
        <div class="yourline">${yourHtml||'<span class="hint-msg">(vide)</span>'}</div>
        <div class="hint-msg miss-msg">${parts.join(" · ")}. Elle restera dans le journal et reviendra.</div>${typoHTML(res)}
        <div class="reveal" id="revReveal"><div class="lbl">Correction</div><div class="es zh">${ZH.ruby(ref)} ${speakBtn(ref)}</div>${it.tip?`<div class="tip">💡 ${escapeHtml(it.tip)}</div>`:""}</div>
        <div class="btnrow"><button class="btn ghost" id="revRevealBtn">Voir la correction</button><button class="btn primary" id="revNext">Suivant →</button></div>`;
      const rv=document.getElementById("revRevealBtn"); if(rv) rv.onclick=()=>{ document.getElementById("revReveal").classList.add("show"); rv.remove(); };
    }
  }
  document.getElementById("revNext").onclick=()=>{ reviewCurrent=null; renderReview(); if(!document.body.classList.contains("typing")) window.scrollTo({top:0,behavior:"smooth"}); };
  mirrorResult(box);
}

/* ============================================================
   LEXIQUE PAR THÈME (flashcards FR → chinois) + NOMBRES
   ============================================================ */
let lexSet = "all";       // "all" | id de thème | "num"
let lexCurrent = null;    // carte en cours
function lexStore(){ if(!profile().lex) profile().lex={}; return profile().lex; }
function lexWords(){
  const sets = lexSet==="all" ? LEXIQUE : LEXIQUE.filter(l=>l.id===lexSet);
  const out = [];
  sets.forEach(l=> l.words.forEach(w=> out.push(Object.assign({ set:l.id }, w))));
  return out;
}
function lexKey(w){ return "v|"+w.set+"|"+w.zh; }
function lexMastered(){
  const s=lexStore(); let n=0;
  lexWords().forEach(w=>{ const r=s[lexKey(w)]; if(r && r.ok>=ACQUIRE_AT && r.ok>r.ko) n++; });
  return n;
}
function newLexCard(){
  if(lexSet==="num"){
    const x=Math.random();
    const n = x<.5 ? 1+randInt(100) : x<.8 ? 100+randInt(900) : 1000+randInt(1100);
    const a = ZH.numAnswers(n);
    lexCurrent = { set:"num", fr:String(n), zh:a[0], alt:a.slice(1) };
    return;
  }
  const words = lexWords(), s = lexStore();
  const score = w=>{ const r=s[lexKey(w)]; return r ? r.ok - r.ko*2 + Math.random()*1.5 : -1 + Math.random(); };
  const sorted = words.filter(w=>!lexCurrent || lexKey(w)!==lexKey(lexCurrent)).sort((a,b)=>score(a)-score(b));
  lexCurrent = sorted[randInt(Math.min(6, sorted.length))] || words[0];
}
// Réponse en caractères ou en pinyin ; ton faux / homophone = petite faute (validé)
function lexCheck(val, w){
  const r = ZH.evaluate(val, [w.zh].concat(w.alt||[]));
  return { ok: r.perfect, typo: r.typos.map(t=>`${t.u} → ${t.r}`).join(", "), res: r };
}
// Pinyin d'un caractère (lecture du mot d'exemple)
function hanziReading(h){
  if(h.c==="不") return { s:"bu", t:4, py:"bù" };   // lecture de base (bú seulement devant un 4e ton)
  if(h.c==="一") return { s:"yi", t:1, py:"yī" };
  const t = ZH.tokensOf(h.w).find(x=>x.h===h.c) || ZH.tokensOf(h.c)[0];
  return { s:t.s, t:t.t, py:t.py };
}
function hanziCheck(val, rd){
  const toks = ZH.parsePinyin(val, [rd]).filter(t=>!t.bad);
  if(toks.length!==1) return { ok:false };
  const u = toks[0];
  const base = u.s===rd.s || u.s.replace(/v/g,"u")===rd.s.replace(/v/g,"u");
  if(!base) return { ok:false };
  const toneOk = u.t===null || u.t===rd.t || rd.t===0;
  return { ok:true, typo: (toneOk && u.s===rd.s) ? "" : `${u.disp} → ${rd.py}` };
}
function openLexique(setId){
  vocabFilter="lexique"; lexSet=setId; lexCurrent=null;
  switchTab("vocab");
}
function renderLexique(){
  const el = document.getElementById("view-vocab");
  if(!lexCurrent) newLexCard();
  const w = lexCurrent;
  const opts = `<option value="all" ${lexSet==="all"?"selected":""}>📚 Tous les thèmes (${LEXIQUE.reduce((n,l)=>n+l.words.length,0)} mots)</option>`
    + LEXIQUE.map(l=>`<option value="${l.id}" ${lexSet===l.id?"selected":""}>${escapeHtml(l.label)} (${l.words.length})</option>`).join("")
    + `<option value="num" ${lexSet==="num"?"selected":""}>🔢 Nombres (en chinois)</option>`;
  const total = lexSet==="num" ? 0 : lexWords().length;
  el.innerHTML = `
    ${vocabSegHTML()}
    <div style="margin-bottom:12px">
      <div class="prompt-label" style="margin-bottom:6px">Lexique</div>
      <select id="lexSel" class="answer" style="padding:12px 40px 12px 14px;font-size:15px;-webkit-appearance:none;appearance:none;background:#fbfcfe url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2214%22 height=%2214%22 fill=%22none%22 stroke=%22%237b8496%22 stroke-width=%222.5%22><path d=%22M3 5l4 4 4-4%22/></svg>') no-repeat right 14px center">${opts}</select>
    </div>
    <div class="card">
      <div class="ex-count">
        <span>${lexSet==="num" ? "Nombres aléatoires" : `${lexMastered()}/${total} mots acquis`}</span>
        <span class="chip blue">${lexSet==="num"?"🔢 chiffres → chinois":"FR → 中文"}</span>
      </div>
      <div class="prompt-label">${lexSet==="num"?"Écris ce nombre en chinois":"Comment dit-on en chinois ?"}</div>
      <div class="prompt">${escapeHtml(w.fr)}</div>
      <textarea class="answer" id="lexAnswer" rows="1" placeholder="${lexSet==="num"?"ex : sanshi'er ou 三十二":"ex : kafei ou 咖啡"}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send"></textarea>
      <div class="accents" id="lexAccents"></div>
      <div class="btnrow mainrow">
        <button class="btn soft" id="lexSkip" style="flex:.5">Passer</button>
        <button class="btn primary" id="lexCheckBtn">Vérifier</button>
      </div>
      <div class="result hidden" id="lexResult"></div>
    </div>
    <div class="empty" style="padding-top:22px;font-size:12.5px">Réponds en pinyin (tons facultatifs) ou en caractères. Les mots ratés reviennent plus souvent.</div>`;
  bindVocabSeg(el);
  buildAccentBar("lexAccents","lexAnswer");
  document.getElementById("lexSel").onchange = e=>{ lexSet=e.target.value; lexCurrent=null; renderLexique(); };
  document.getElementById("lexSkip").onclick = ()=>{ newLexCard(); renderLexique(); };
  document.getElementById("lexCheckBtn").onclick = doLexCheck;
  const inp = document.getElementById("lexAnswer");
  keepFocus(inp);
  inp.addEventListener("keydown", enterMain);
}
function doLexCheck(){
  const w = lexCurrent;
  const val = document.getElementById("lexAnswer").value.trim();
  if(!val){ toast("Écris ta réponse d'abord ✍️"); return; }
  const r = lexCheck(val, w);
  const k = w.set==="num" ? "v|num|"+w.fr : lexKey(w);
  if(w.set!=="num"){
    const s = lexStore(); if(!s[k]) s[k]={ok:0,ko:0};
    if(r.ok) s[k].ok++; else s[k].ko++;
  }
  if(r.ok) resolveMistake(k);
  else logMistake({ type:"v", k, fr:w.fr, es:[w.zh].concat(w.alt||[]), tense: w.set==="num"?"nombre":"lexique" });
  save();
  const box = document.getElementById("lexResult");
  box.classList.remove("hidden");
  const answer = `${ZH.ruby(w.zh)} ${speakBtn(w.zh)}`;
  box.innerHTML = r.ok
    ? `<div class="verdict"><span class="badge" style="background:var(--green)">✓</span> Correct !</div>
       ${r.typo?`<div class="hint-msg">✍️ Petite faute (en orange), pas à refaire : <b style="color:#d9730d">${escapeHtml(r.typo)}</b></div>`:""}
       <div class="reveal show"><div class="es zh">${answer}</div></div>
       <div class="btnrow"><button class="btn primary" id="lexNext">Mot suivant →</button></div>`
    : `<div class="verdict"><span class="badge" style="background:var(--amber)">!</span> Pas tout à fait.</div>
       <div class="yourline">${userLineHTML(r.res)}</div>
       <div class="reveal show" style="background:var(--amber-soft)"><div class="lbl" style="color:#a37b00">La bonne réponse</div><div class="es zh" style="color:#a37b00">${answer}</div>${(w.alt&&w.alt.length)?`<div class="tip" style="color:#8a6d00">Aussi : ${escapeHtml(w.alt.join("、"))}</div>`:""}</div>
       <div class="btnrow"><button class="btn primary" id="lexNext">Mot suivant →</button></div>`;
  document.getElementById("lexNext").onclick = ()=>{ newLexCard(); renderLexique(); };
  mirrorResult(box);
  if(r.ok) toast("太好了 ! 📚");
}

/* ============================================================
   HORS-LIGNE (mode avion) — service worker + statut de synchro
   ============================================================ */
let swReady = false;
function offlineCardHTML(){
  const pending = Object.keys(readDirty()).length;
  const supported = "serviceWorker" in navigator;
  const status = !supported ? "Ce navigateur ne gère pas le hors-ligne."
    : swReady ? "Tout est téléchargé : parcours, grammaire, caractères et lexique marchent sans réseau."
    : "Téléchargement des exercices en cours…";
  const sync = API===false ? "Progression gardée sur cet appareil."
    : isGuest() ? "Invité : progression locale uniquement."
    : !navigator.onLine ? `Hors-ligne · ${pending ? pending+" profil(s) à synchroniser au retour du réseau" : "tout est à jour"}`
    : pending ? `${pending} profil(s) en attente de synchronisation` : "Progression synchronisée avec le serveur ✓";
  return `<div class="card offline" id="offlineCard">
    <div class="ic">✈️</div>
    <div style="flex:1;min-width:0"><b>Mode avion</b>
      <small>${status}</small>
      <small id="syncBadge">${sync}</small></div>
    ${supported && !swReady ? `<button class="btn primary" id="dlBtn">Télécharger</button>` : ""}
  </div>`;
}
function bindOfflineCard(){
  const b = document.getElementById("dlBtn");
  if(b) b.onclick = async ()=>{ b.disabled=true; b.textContent="…"; await registerSW(); if(activeTab==="days") renderDays(); };
}
function refreshSyncBadge(){
  if(activeTab==="days" && document.getElementById("offlineCard")){
    const card = document.getElementById("offlineCard");
    const tmp = document.createElement("div"); tmp.innerHTML = offlineCardHTML();
    card.replaceWith(tmp.firstElementChild); bindOfflineCard();
  }
}
window.addEventListener("offline", refreshSyncBadge);
async function registerSW(){
  if(!("serviceWorker" in navigator)) return;
  try{
    await navigator.serviceWorker.register("sw.js");
    await navigator.serviceWorker.ready;
    swReady = true;
  }catch(e){ console.warn("SW", e); }
  refreshSyncBadge();
}

/* ============================================================
   ONGLET GRAMMAIRE : fiches + quiz · tons · caractères
   ============================================================ */
function randInt(n){ return Math.floor(Math.random()*n); }
let gMode = "gram";        // "gram" | "tons" | "hanzi"
let gQuiz = null;          // { g, i, picked }
let toneCur = null;        // { w, toks, picks }
let hzMode = "train";      // "train" | "list"
let hzCur = null;          // caractère en cours
function gStore(k){ const p=profile(); if(!p[k]) p[k]={}; return p[k]; }
function setGMode(m){ gMode=m; gQuiz=null; renderVerbs(false); window.scrollTo({top:0}); }
function speakBtn(text){
  if(!ZH.canSpeak()) return "";
  return `<button class="spk" type="button" data-t="${escapeHtml(text)}" onclick="ZH.speak(this.dataset.t)" aria-label="Écouter">🔊</button>`;
}

function renderVerbs(){
  const el = document.getElementById("view-verbs");
  const seg = `<div class="seg" style="margin-bottom:14px">
    <button class="${gMode==="gram"?"on":""}" onclick="setGMode('gram')">📖 Grammaire</button>
    <button class="${gMode==="tons"?"on":""}" onclick="setGMode('tons')">🎵 Tons</button>
    <button class="${gMode==="hanzi"?"on":""}" onclick="setGMode('hanzi')">字 Caractères</button></div>`;
  if(gMode==="tons"){ el.innerHTML = seg + tonesHTML(); bindTones(); return; }
  if(gMode==="hanzi"){ renderHanzi(el, seg); return; }
  if(gQuiz){ el.innerHTML = seg + quizHTML(); bindQuiz(); return; }
  const done = gStore("gram");
  el.innerHTML = seg + `<div class="thint">Touche une fiche pour la lire, puis fais le quiz (3 questions).</div>` +
    GRAMMAR.map(g=>`
    <details class="card gfiche">
      <summary><span>${escapeHtml(g.title)}</span>${done[g.id]!==undefined?`<span class="chip ${done[g.id]===g.quiz.length?"green":"gray"}">${done[g.id]}/${g.quiz.length}</span>`:""}</summary>
      <p class="grule">${escapeHtml(g.rule)}</p>
      <div class="gex">${g.examples.map(([zh,fr])=>`<div><div class="zh">${ZH.ruby(zh)} ${speakBtn(zh)}</div><small>${escapeHtml(fr)}</small></div>`).join("")}</div>
      <div class="btnrow"><button class="btn primary" onclick="startQuiz('${g.id}')">Quiz →</button></div>
    </details>`).join("");
}
function startQuiz(id){ gQuiz = { g: GRAMMAR.find(x=>x.id===id), i:0, picked:null, score:0 }; renderVerbs(); window.scrollTo({top:0}); }
function quizHTML(){
  const { g, i, picked } = gQuiz, q = g.quiz[i];
  const blank = picked===null ? `<span class="blank">＿</span>` : `<span class="blank ${picked===q.answer?"ok":"ko"}">${escapeHtml(q.answer==="（rien）"?"∅":q.answer)}</span>`;
  const [a,b] = q.q.split("＿");
  const full = q.q.replace("＿", q.answer==="（rien）" ? "" : q.answer);
  return `
    <div class="dayhead">
      <div class="nav"><button class="iconbtn" onclick="gQuiz=null;renderVerbs()">${chev("left")}</button></div>
      <div class="daytitle"><b>${escapeHtml(g.title)}</b><small>Question ${i+1} / ${g.quiz.length}</small></div>
      <div class="nav" style="width:38px"></div>
    </div>
    <div class="card">
      <div class="prompt-label">Complète la phrase</div>
      <div class="prompt zh">${escapeHtml(a)}${blank}${escapeHtml(b)}</div>
      <div class="hint-msg" style="margin:-8px 0 14px">${escapeHtml(q.fr)}</div>
      <div class="qopts">${q.options.map(o=>`<button class="qopt ${picked===null?"":o===q.answer?"ok":o===picked?"ko":""}" ${picked===null?"":"disabled"} data-o="${escapeHtml(o)}">${escapeHtml(o)}</button>`).join("")}</div>
      ${picked===null ? "" : `
        <div class="result">
          <div class="verdict"><span class="badge" style="background:${picked===q.answer?"var(--green)":"var(--amber)"}">${picked===q.answer?"✓":"!"}</span> ${picked===q.answer?"Bien joué !":"Pas tout à fait."}</div>
          <div class="reveal show"><div class="es zh">${ZH.ruby(full)} ${speakBtn(full)}</div><div class="tip">💡 ${escapeHtml(q.why)}</div></div>
          <div class="btnrow" style="display:flex"><button class="btn primary" id="qNext">${i+1<g.quiz.length?"Question suivante →":"Terminer"}</button></div>
        </div>`}
    </div>`;
}
function bindQuiz(){
  document.querySelectorAll(".qopt").forEach(b=> b.onclick=()=>{
    const q = gQuiz.g.quiz[gQuiz.i];
    gQuiz.picked = b.dataset.o;
    if(gQuiz.picked===q.answer) gQuiz.score++;
    renderVerbs();
  });
  const n = document.getElementById("qNext");
  if(n) n.onclick = ()=>{
    if(gQuiz.i+1 < gQuiz.g.quiz.length){ gQuiz.i++; gQuiz.picked=null; renderVerbs(); return; }
    const st = gStore("gram"); st[gQuiz.g.id] = Math.max(st[gQuiz.g.id]||0, gQuiz.score); save();
    toast(`${gQuiz.score}/${gQuiz.g.quiz.length} ${gQuiz.score===gQuiz.g.quiz.length?"🎉":""}`);
    gQuiz = null; renderVerbs(); window.scrollTo({top:0});
  };
}

/* ---- Tons ---- */
const TONE_BTNS = [[1,"ā","1"],[2,"á","2"],[3,"ǎ","3"],[4,"à","4"],[0,"a","neutre"]];
function newToneWord(){
  const pool = LEXIQUE.flatMap(l=>l.words).filter(w=>!/[一不儿]/.test(w.zh) && w.zh.length<=3);
  const w = pool[randInt(pool.length)];
  toneCur = { w, toks: ZH.tokensOf(w.zh), picks: [], checked:false };
}
function tonesHTML(){
  if(!toneCur) newToneWord();
  const st = gStore("tones");
  const { w, toks, picks, checked } = toneCur;
  const cols = toks.map((t,i)=>`
    <div class="tcolz">
      <div class="zhbig">${escapeHtml(t.h)}</div>
      <div class="tpy ${checked ? (picks[i]===t.t?"ok":"ko") : ""}">${checked ? escapeHtml(t.py) : escapeHtml(t.s.replace(/v/g,"ü"))}</div>
      <div class="tbtns">${TONE_BTNS.map(([n,lbl,sub])=>`<button class="tbtn ${picks[i]===n?"on":""} ${checked&&n===t.t?"right":""}" data-i="${i}" data-n="${n}" ${checked?"disabled":""}><b>${lbl}</b><small>${sub}</small></button>`).join("")}</div>
    </div>`).join("");
  const allRight = checked && toks.every((t,i)=>picks[i]===t.t);
  return `
    <div class="card">
      <div class="ex-count"><span>${st.ok||0} juste${(st.ok||0)>1?"s":""} · ${st.ko||0} raté${(st.ko||0)>1?"s":""}</span>${speakBtn(w.zh)}</div>
      <div class="prompt-label">Choisis le ton de chaque syllabe</div>
      <div class="hint-msg" style="margin:-2px 0 12px">${escapeHtml(w.fr)}</div>
      <div class="tgrid">${cols}</div>
      ${checked ? `<div class="verdict" style="margin-top:14px"><span class="badge" style="background:${allRight?"var(--green)":"var(--amber)"}">${allRight?"✓":"!"}</span> ${allRight?"Tons justes !":"Regarde les tons en vert."}</div>` : ""}
      <div class="btnrow"><button class="btn primary" id="toneBtn">${checked?"Mot suivant →":"Vérifier"}</button></div>
    </div>
    <div class="empty" style="padding-top:18px;font-size:12.5px">1 = haut et plat · 2 = monte · 3 = descend puis remonte · 4 = descend fort · neutre = léger.</div>`;
}
function bindTones(){
  document.querySelectorAll(".tbtn").forEach(b=> b.onclick=()=>{
    toneCur.picks[Number(b.dataset.i)] = Number(b.dataset.n);
    renderVerbs();
  });
  document.getElementById("toneBtn").onclick = ()=>{
    if(toneCur.checked){ newToneWord(); renderVerbs(); return; }
    if(toneCur.picks.filter(x=>x!==undefined).length < toneCur.toks.length){ toast("Choisis un ton pour chaque syllabe"); return; }
    toneCur.checked = true;
    const right = toneCur.toks.every((t,i)=>toneCur.picks[i]===t.t);
    const st = gStore("tones"); st[right?"ok":"ko"] = (st[right?"ok":"ko"]||0)+1; save();
    ZH.speak(toneCur.w.zh);
    renderVerbs();
  };
}

/* ---- Caractères ---- */
function hzStore(){ return gStore("hanzi"); }
function newHanzi(){
  const s = hzStore();
  const score = h=>{ const r=s[h.c]; return r ? r.ok - r.ko*2 + Math.random()*1.5 : -1 + Math.random(); };
  const sorted = HANZI.filter(h=>!hzCur || h.c!==hzCur.c).sort((a,b)=>score(a)-score(b));
  hzCur = sorted[randInt(Math.min(8, sorted.length))];
}
function renderHanzi(el, seg){
  const s = hzStore();
  const known = HANZI.filter(h=>s[h.c] && s[h.c].ok>=ACQUIRE_AT && s[h.c].ok>s[h.c].ko).length;
  const sub = `<div class="seg" style="margin-bottom:14px">
    <button class="${hzMode==="train"?"on":""}" onclick="hzMode='train';renderVerbs()">S'entraîner</button>
    <button class="${hzMode==="list"?"on":""}" onclick="hzMode='list';renderVerbs()">Liste (${HANZI.length})</button></div>`;
  if(hzMode==="list"){
    el.innerHTML = seg + sub + `<div class="thint">${known}/${HANZI.length} caractères acquis · touche un caractère pour l'écouter.</div>
      <div class="hzgrid">${HANZI.map(h=>{ const r=hanziReading(h), st=s[h.c];
        const cls = st ? (st.ok>=ACQUIRE_AT && st.ok>st.ko ? "ok" : st.ko ? "ko" : "") : "";
        return `<button class="hz ${cls}" onclick="ZH.speak('${h.c}')"><b>${escapeHtml(h.c)}</b><span>${escapeHtml(r.py)}</span><small>${escapeHtml(h.fr)}</small></button>`; }).join("")}</div>`;
    return;
  }
  if(!hzCur) newHanzi();
  const h = hzCur;
  el.innerHTML = seg + sub + `
    <div class="card">
      <div class="ex-count"><span>${known}/${HANZI.length} caractères acquis</span><span class="chip amber">字 → pinyin</span></div>
      <div class="prompt-label">Écris le pinyin de ce caractère</div>
      <div class="prompt zhbig">${escapeHtml(h.c)}</div>
      <textarea class="answer" id="hzAnswer" rows="1" placeholder="ex : hǎo, hao3 ou hao" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send"></textarea>
      <div class="accents" id="hzAccents"></div>
      <div class="btnrow mainrow">
        <button class="btn soft" id="hzSkip" style="flex:.5">Passer</button>
        <button class="btn primary" id="hzCheck">Vérifier</button>
      </div>
      <div class="result hidden" id="hzResult"></div>
    </div>
    <div class="empty" style="padding-top:18px;font-size:12.5px">Tons facultatifs. Les caractères ratés reviennent plus souvent.</div>`;
  buildAccentBar("hzAccents","hzAnswer");
  document.getElementById("hzSkip").onclick = ()=>{ newHanzi(); renderVerbs(); };
  document.getElementById("hzCheck").onclick = doHanziCheck;
  const inp = document.getElementById("hzAnswer");
  keepFocus(inp);
  inp.addEventListener("keydown", enterMain);
}
function doHanziCheck(){
  const h = hzCur, rd = hanziReading(h);
  const val = document.getElementById("hzAnswer").value.trim();
  if(!val){ toast("Écris le pinyin ✍️"); return; }
  const r = hanziCheck(val, rd);
  const s = hzStore(); if(!s[h.c]) s[h.c]={ok:0,ko:0};
  if(r.ok) s[h.c].ok++; else s[h.c].ko++;
  const k = "h|"+h.c;
  if(r.ok) resolveMistake(k);
  else logMistake({ type:"h", k, fr:h.c, es:[rd.py], s:rd.s, t:rd.t });
  save();
  const box = document.getElementById("hzResult");
  box.classList.remove("hidden");
  const info = `<div class="es zh">${escapeHtml(h.c)} · ${escapeHtml(rd.py)} ${speakBtn(h.c)}</div>
    <div class="tip">${escapeHtml(h.fr)}</div>
    <div class="tip">Ex. : <span class="zh">${ZH.ruby(h.w)}</span> = ${escapeHtml(h.wfr)} ${speakBtn(h.w)}</div>`;
  box.innerHTML = (r.ok
    ? `<div class="verdict"><span class="badge" style="background:var(--green)">✓</span> Correct !</div>
       ${r.typo?`<div class="hint-msg">✍️ Petit écart de ton (en orange), pas à refaire : <b style="color:#d9730d">${escapeHtml(r.typo)}</b></div>`:""}
       <div class="reveal show">${info}</div>`
    : `<div class="verdict"><span class="badge" style="background:var(--amber)">!</span> Pas tout à fait.</div>
       <div class="yourline"><span class="w bad">${escapeHtml(val)}</span></div>
       <div class="reveal show" style="background:var(--amber-soft)">${info}</div>`)
    + `<div class="btnrow"><button class="btn primary" id="hzNext">Caractère suivant →</button></div>`;
  document.getElementById("hzNext").onclick = ()=>{ newHanzi(); renderVerbs(); };
  mirrorResult(box);
  if(r.ok) toast("好！");
}

   NAVIGATION / UTILITAIRES

function switchTab(tab){
  exitTyping();
  activeTab=tab;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.tab===tab));
  document.getElementById("view-today").classList.toggle("hidden",tab!=="today");
